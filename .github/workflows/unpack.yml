name: Unpack bundle
on:
  push:
    paths: [bundle.zip]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o bundle.zip
          git rm -q bundle.zip
          git config user.name "oneskill-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Add OneSkill: router skill, catalog, rating pipeline and website"
          git push
